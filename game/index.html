<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadows of Pasar Senja — Stealth Heist</title>
<style>
  html, body { margin: 0; padding: 0; background: #070b14; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 1280px; height: 800px; }
  canvas { display: block; width: 1280px; height: 800px; background: #0c1526;
    box-shadow: 0 0 0 1px #1d2f4d, 0 18px 60px rgba(0,0,0,.6); cursor: crosshair; }
  #hint { position: absolute; left: 0; bottom: -26px; width: 1280px; text-align: center;
    color: #5f7ba6; font: 12px/1.4 system-ui, sans-serif; letter-spacing: .04em; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="hint">WASD / ARROWS move &nbsp;·&nbsp; SHIFT crouch &nbsp;·&nbsp; CLICK throw a coin &nbsp;·&nbsp; E grab loot &nbsp;·&nbsp; 1-2-3 choose level &nbsp;·&nbsp; R restart level</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
